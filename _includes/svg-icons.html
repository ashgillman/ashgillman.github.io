{% if site.footer-links.email %}<a href="mailto:{{ site.footer-links.email }}" aria-label="Email" title="Email"><i class="svg-icon email"></i></a>{% endif %}
{% if site.footer-links.github %}<a href="https://github.com/{{ site.footer-links.github }}"><i class="svg-icon github"></i></a>{% endif %}
{% if site.footer-links.google_scholar %}<a href="{{ site.footer-links.google_scholar }}" aria-label="Google Scholar" title="Google Scholar"><i class="svg-icon google-scholar"></i></a>{% endif %}
{% if site.footer-links.linkedin %}<a href="https://www.linkedin.com/in/{{ site.footer-links.linkedin }}" aria-label="LinkedIn" title="LinkedIn"><i class="svg-icon linkedin"></i></a>{% endif %}
{% if site.footer-links.orcid %}<a href="https://orcid.org/{{ site.footer-links.orcid }}" aria-label="ORCID" title="ORCID"><i class="svg-icon orcid">iD</i></a>{% endif %}
