<li>
  <span class="post-meta">{{ include.post.date | date: "%b %-d, %Y" }}{% if include.post.meta %}: {{ include.post.meta }}{% endif %}</span>

  <h2 class="post-link">
    <a href="{{ include.post.url | relative_url }}">{{ include.post.title }}</a>
  </h2>

  <span class="post-tags">{{ include.post.tags | join: ' ' }}</span>
</li>
